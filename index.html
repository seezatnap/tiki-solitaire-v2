<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, maximum-scale=1"
    />
    <meta name="theme-color" content="#04100e" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="Tiki Solitaire — pair cards to fourteen, forge dominos, and chain them into a perfect circle."
    />
    <title>Tiki Solitaire</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Outfit:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />

    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/icons/favicon-96.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tiki Solitaire" />

    <!-- Startup screens for an installed copy on iOS. -->
    <link
      rel="apple-touch-startup-image"
      media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3)"
      href="/icons/splash-1290x2796.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3)"
      href="/icons/splash-1179x2556.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)"
      href="/icons/splash-1170x2532.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2)"
      href="/icons/splash-828x1792.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="(device-width: 768px) and (device-height: 1024px) and (-webkit-device-pixel-ratio: 2)"
      href="/icons/splash-1536x2048.png"
    />

    <style>
      html {
        background: #04100e;
      }

      /* Painted in the markup so it is on screen before any script runs. */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 500;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background:
          radial-gradient(120% 90% at 50% 12%, #0f3a33 0%, transparent 62%),
          linear-gradient(180deg, #051512 0%, #061c19 45%, #030d0c 100%);
        transition: opacity 0.45s ease, visibility 0.45s;
      }

      #splash img {
        width: clamp(104px, 26vmin, 168px);
        height: auto;
        border-radius: 26%;
        animation: splash-rise 0.7s cubic-bezier(0.22, 0.9, 0.28, 1) both;
      }

      #splash p {
        margin: 0;
        font-family: 'Fraunces', 'Iowan Old Style', Georgia, serif;
        font-size: clamp(1.1rem, 4.4vmin, 1.6rem);
        letter-spacing: 0.02em;
        color: #f3c977;
        animation: splash-rise 0.7s cubic-bezier(0.22, 0.9, 0.28, 1) 0.08s both;
      }

      #splash.is-gone {
        opacity: 0;
        visibility: hidden;
      }

      @keyframes splash-rise {
        from {
          opacity: 0;
          transform: translateY(10px) scale(0.96);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #splash img,
        #splash p {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <img src="/icons/icon-192.png" alt="" width="192" height="192" />
      <p>Tiki Solitaire</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
